name: flutter_typeahead
version: 5.2.0
publish_to: none

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

description: A highly customizable typeahead (autocomplete) text input field for Flutter
homepage: https://github.com/AbdulRahmanAlHamali/flutter_typeahead

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_keyboard_visibility_fork: ^0.0.2
  pointer_interceptor: ^0.9.3+7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
